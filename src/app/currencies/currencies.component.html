<app-navbar></app-navbar>
<div class="w-full 100% p-10 px-20 bg-[#191944]">
  <div class="flex w-full mb-14">
    <h1 class="w-full text-[#fbfbfb] text-3xl font-bold text-center">My Currencies</h1>
  </div>
  <div class="flex flex-col justify-center items-center">
    <div class="grid grid-cols-1 gap-x-6 gap-y-10 sm:grid-cols-2 lg:grid-cols-3 xl:gap-x-16 w-[1200px]">
      <div
        *ngFor="let currency of favoriteCurrencies"
        class="flex flex-row items-center flex-1 relative bg-[#20204e] rounded-md lg:min-w-[200px] lg:min-h-[100px] hover:brightness-110 hover:cursor-pointer active:brightness-125"
        (click)="selectCurrency(currency.name)"
      >
        <div class="w-1/3 ml-6 mr-1">
          <div class="flex flex-col justify-center items-center rounded-full border-[3px] border-[#fbfbfb] w-16 h-16 p-4">
            <img *ngIf="currency.photo_url" [src]="'/' + currency.photo_url" alt="" />
            <p *ngIf="!currency.photo_url" class="text-[#cccccc] text-2xl font-bold">{{ currency.name }}</p>
          </div>
        </div>
        <div class="flex flex-col">
          <h3 class="text-4xl text-start text-[#fbfbfb]">{{ currency.name }}</h3>
          <div class="flex gap-2">
            <p *ngIf="currency.measurement === '$'" class="text-center text-[#fbfbfb]">${{ currency.price?.toFixed(1) }}</p>
            <p *ngIf="currency.measurement === '%'" class="text-center text-[#fbfbfb]">{{ currency.price?.toFixed(1) }}%</p>
            <p *ngIf="currency.rate && currency.rate > 0" class="text-[#3ed1c7]">&uparrow; {{ currency.rate.toFixed(2) }}%</p>
            <p *ngIf="currency.rate && currency.rate < 0" class="text-red-500">&downarrow; {{ currency.rate.toFixed(2) }}%</p>
          </div>
        </div>
      </div>
    </div>
  </div>
  <div class="w-full flex justify-center items-center mt-10">
    <div class="w-[1200px]">
      <app-chart [title]="selectedCurrency"></app-chart>
    </div>
  </div>
</div>
